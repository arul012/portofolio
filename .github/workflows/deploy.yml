name: Deploy Laravel Portfolio to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, json, openssl
          coverage: none

      - name: 3. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 4. Copy Environment Configuration
        run: cp .env.example .env

      - name: 5. Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: 6. Generate Laravel Application Key
        run: php artisan key:generate

      - name: 7. Build Static Site (Render Blade to Static HTML)
        run: php artisan portfolio:export

      - name: 8. Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
