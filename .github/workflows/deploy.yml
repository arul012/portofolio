name: Deploy Laravel Portfolio to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, json, openssl
          coverage: none

      - name: 3. Copy Environment Configuration
        run: cp .env.example .env

      - name: 4. Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: 5. Generate Laravel Application Key
        run: php artisan key:generate --force

      - name: 6. Set Permissions for Storage and Cache
        run: |
          chmod -R 775 storage bootstrap/cache
          php artisan config:clear
          php artisan view:clear

      - name: 7. Build Static Site
        run: php artisan portfolio:export

      - name: 8. Verify Static Build Output
        run: |
          echo "=== Verifying dist/ folder ==="
          ls -la dist/
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html not found!"
            exit 1
          fi
          echo "SUCCESS: index.html found ($(wc -c < dist/index.html) bytes)"

      - name: 9. Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
